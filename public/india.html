<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trishika Signal Viewer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f5f5;
      margin: 0;
      padding: 2rem;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: #151a2d;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .symbol-input {
      margin: 0.5rem 0 1rem;
    }
    input[type="text"] {
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #333a5a;
      background: #0f1424;
      color: #f5f5f5;
    }
    button {
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: none;
      background: #2563eb;
      color: #f5f5f5;
      cursor: pointer;
      margin-left: 0.5rem;
    }
    button:disabled {
      background: #475569;
      cursor: default;
    }
    .signal {
      font-size: 1.8rem;
      font-weight: 600;
      margin: 0.5rem 0;
    }
    .signal.BUY { color: #22c55e; }
    .signal.SELL { color: #f97316; }
    .signal.NEUTRAL { color: #e5e7eb; }
    .meta {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.5rem;
    }
    .reason {
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }
    .error {
      margin-top: 0.5rem;
      color: #f97373;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Trishika Trading Signal</h1>
    <div class="symbol-input">
      <label>
        Symbol:
        <input type="text" id="symbol" value="NIFTY" />
      </label>
      <button id="fetchBtn">Get Signal</button>
    </div>

    <div id="status" class="meta">Idle</div>

    <div id="signal" class="signal NEUTRAL">—</div>
    <div id="confidence" class="meta"></div>
    <div id="reason" class="reason"></div>
    <div id="error" class="error"></div>
  </div>

  <script>
    const btn = document.getElementById('fetchBtn');
    const symbolInput = document.getElementById('symbol');
    const statusEl = document.getElementById('status');
    const signalEl = document.getElementById('signal');
    const confEl = document.getElementById('confidence');
    const reasonEl = document.getElementById('reason');
    const errorEl = document.getElementById('error');

    async function fetchSignal() {
      const symbolRaw = symbolInput.value.trim();
      if (!symbolRaw) return;
      const symbol = symbolRaw.toUpperCase();

      btn.disabled = true;
      errorEl.textContent = '';
      reasonEl.textContent = '';
      confEl.textContent = '';
      statusEl.textContent = 'Loading...';

      try {
        const url = 'http://localhost:3000/api/india/signal?symbol=' + encodeURIComponent(symbol);
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }
        const data = await res.json();

        const sig = (data.signal || 'NEUTRAL').toUpperCase();
        const confidence = (data.confidence !== undefined && data.confidence !== null)
          ? data.confidence
          : '-';
        const reason = data.reason || '';

        signalEl.textContent = sig;
        signalEl.className = 'signal ' + sig;
        confEl.textContent = 'Confidence: ' + confidence;
        reasonEl.textContent = reason;

        const agent = data.agent || 'n/a';
        const source = data._source || 'n/a';
        statusEl.textContent = 'OK · agent=' + agent + ' · source=' + source;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error';
        errorEl.textContent = 'Failed to fetch signal: ' + err.message;
        signalEl.textContent = '—';
        signalEl.className = 'signal NEUTRAL';
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', fetchSignal);
    symbolInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') fetchSignal();
    });

    // Auto-load BTC on page open
    fetchSignal();
  </script>
</body>
</html>
